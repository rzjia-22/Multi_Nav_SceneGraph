name: multi-nav-scenegraph

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///workspace/config/system/cyclonedds.xml
  MNS_RUN_ROOT: /workspace/runs

services:
  robotics-dev:
    build:
      context: .
      dockerfile: containers/robotics/Dockerfile
    image: multi-nav-scenegraph/robotics:jazzy-hydra-8f3b7e3
    network_mode: host
    ipc: host
    environment: *ros-environment
    volumes:
      - .:/workspace:rw
    working_dir: /workspace/ros_ws
    command: bash
    stdin_open: true
    tty: true
    # ROS 2 launch handles SIGINT as its normal coordinated shutdown path.
    # Hydra needs enough time to drain workers and serialize DSG/mesh outputs.
    stop_signal: SIGINT
    stop_grace_period: 75s

  robotics-phase1:
    extends: robotics-dev
    profiles: [robotics]
    command: >-
      ros2 launch mns_bringup phase1.launch.py
      system_config:=/workspace/config/robots/${MNS_ROBOT_CONFIG:-phase1.yaml}
      navigator:=${MNS_NAVIGATOR:-configured}
      run_id:=${MNS_RUN_ID:-current}

  robotics-phase2:
    extends: robotics-dev
    profiles: [robotics]
    command: >-
      ros2 launch mns_bringup phase2.launch.py
      system_config:=/workspace/config/robots/${MNS_ROBOT_CONFIG:-phase2.yaml}
      navigator:=${MNS_NAVIGATOR:-configured}
      run_id:=${MNS_RUN_ID:-current}

  robotics-ml-dev:
    extends: robotics-dev
    profiles: [ml]
    build:
      context: .
      dockerfile: containers/robotics-ml/Dockerfile
    image: multi-nav-scenegraph/robotics-ml:jazzy-torch-2.7.1
    environment:
      <<: *ros-environment
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TORCH_HOME: /workspace/runs/cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  robotics-phase1-diffusion:
    extends: robotics-ml-dev
    profiles: [ml]
    command: >-
      ros2 launch mns_bringup phase1.launch.py
      navigator:=diffusion
      diffusion_model_backend:=${MNS_DIFFUSION_BACKEND:-legacy}
      diffusion_checkpoint:=${MNS_DIFFUSION_CHECKPOINT:-/workspace/models/navdiffusion.ckpt}
      run_id:=${MNS_RUN_ID:-diffusion}

  robotics-research-navigation:
    extends: robotics-ml-dev
    profiles: [research-navigation]
    command: >-
      ros2 launch mns_bringup research_navigation.launch.py
      navigator_package:=${MNS_EVAL_NAVIGATOR_PACKAGE:-mns_navigation}
      navigator_executable:=${MNS_EVAL_NAVIGATOR_EXECUTABLE:-diffusion_navigator}
      model_backend:=${MNS_EVAL_MODEL_BACKEND:-mns_v0}
      checkpoint:=${MNS_EVAL_CHECKPOINT:-/workspace/models/trained/navdiffusion_v0/best.pt}
      device:=${MNS_EVAL_DEVICE:-cuda}
      robot_id:=${MNS_EVAL_ROBOT_ID:-diablo_1}
      history_length:=${MNS_EVAL_HISTORY_LENGTH:-5}
      planning_rate_hz:=${MNS_EVAL_PLANNING_RATE_HZ:-2.0}
      control_waypoints:=${MNS_EVAL_CONTROL_WAYPOINTS:-8}
      goal_tolerance_m:=${MNS_EVAL_GOAL_TOLERANCE_M:-0.35}

  simulation:
    profiles: [simulation]
    build:
      context: .
      dockerfile: containers/simulation/Dockerfile
    image: multi-nav-scenegraph/simulation:isaac-lab-2.3.1
    network_mode: host
    ipc: host
    environment:
      <<: *ros-environment
      ACCEPT_EULA: Y
      CYCLONEDDS_URI: file:///mns/config/system/cyclonedds.xml
      MNS_PROJECT_ROOT: /mns
      MNS_RUN_ROOT: /mns/runs
      MNS_ROBOT_CONFIG: ${MNS_ROBOT_CONFIG:-}
      PRIVACY_CONSENT: Y
      OMNI_KIT_ALLOW_ROOT: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DISTRO: jazzy
      LD_LIBRARY_PATH: /isaac-sim/exts/isaacsim.ros2.bridge/jazzy/lib
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/mns-xauthority
      QT_X11_NO_MITSHM: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # The Isaac Lab image owns /workspace/isaaclab.  Mounting the project at
      # /workspace would hide that runtime directory.
      - .:/mns:rw
      - isaac-kit-cache:/isaac-sim/kit/cache:rw
      - isaac-ov-cache:/root/.cache/ov:rw
      - isaac-compute-cache:/root/.nv/ComputeCache:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/mns-xauthority:ro
    working_dir: /mns
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: >-
      /mns/containers/simulation/entrypoint.sh
      --scenario ${MNS_SCENARIO:-phase1_go2}
      --headless
      --enable_cameras

  simulation-research-navigation:
    extends: simulation
    profiles: [research-navigation]
    command: >-
      /mns/containers/simulation/entrypoint.sh
      --research-navigation
      --scene /mns/research_scenes/dataset_v0/${MNS_EVAL_SCENE:-validation_scene_000}/scene.yaml
      --split ${MNS_EVAL_SPLIT:-validation}
      --episodes ${MNS_EVAL_EPISODES:-validation_scene_000_episode_000}
      --run-id ${MNS_EVAL_RUN_ID:-manual}
      --evaluation-id ${MNS_EVAL_ID:-manual}
      --run-root ${MNS_EVAL_RUN_ROOT:-/mns/runs/navigation_evaluation}
      --robot-id ${MNS_EVAL_ROBOT_ID:-diablo_1}
      --navigator-id ${MNS_EVAL_NAVIGATOR_ID:-unspecified}
      --model-artifact-sha256 ${MNS_EVAL_CHECKPOINT_SHA256:-unknown}
      --prediction-waypoints ${MNS_EVAL_PREDICTION_WAYPOINTS:-32}
      --control-waypoints ${MNS_EVAL_CONTROL_WAYPOINTS:-8}
      --goal-tolerance ${MNS_EVAL_GOAL_TOLERANCE_M:-0.35}
      --maximum-duration ${MNS_EVAL_MAXIMUM_DURATION_S:-60}
      --command-timeout ${MNS_EVAL_COMMAND_TIMEOUT_S:-0.30}
      ${MNS_EVAL_CAPTURE_FLAG:-}
      --headless --enable_cameras

volumes:
  isaac-kit-cache:
  isaac-ov-cache:
  isaac-compute-cache:
